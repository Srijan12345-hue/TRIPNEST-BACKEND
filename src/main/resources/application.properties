spring.application.name=TRIP NEST
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8082

security.jwt.secret=${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50SldUU2VjcmV0S2V5VGhhdElzMzJC}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Google OAuth2 login ---
# Created credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URI to register there: localhost:8082/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

#Afetr the login with google it will email and Name
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# After a successful Google login, the backend issues our own JWT.
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:}
# Default role granted to a brand-new user created via Google sign-in.
app.oauth2.default-role=${OAUTH2_DEFAULT_ROLE:USER}
